<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lemieux — Plex Archivist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .message pre { white-space: pre-wrap; word-break: break-word; }
    .tool-call { font-size: 0.75rem; }
    @keyframes pulse-dot {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .typing-dot { animation: pulse-dot 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-stone-800 border-b border-stone-700 p-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-amber-600 flex items-center justify-center font-bold text-stone-900">L</div>
      <div>
        <h1 class="font-semibold text-sm">Lemieux</h1>
        <p class="text-xs text-stone-400">Plex archivist & release watch</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="sweep-btn" class="bg-amber-600 hover:bg-amber-500 text-stone-900 text-xs font-semibold px-3 py-2 rounded-md transition">
        Run sweep
      </button>
      <button id="clear-btn" class="text-xs text-stone-400 hover:text-stone-200 px-2 py-2">
        Clear
      </button>
    </div>
  </header>

  <!-- Messages -->
  <main id="messages" class="flex-1 overflow-y-auto p-4 space-y-4">
    <div class="text-center text-stone-500 text-sm mt-8" id="empty-state">
      Ask Lemieux about your library.<br>Examples:<br>
      “How many versions of High Time do I have?”<br>
      “How many Jimi Hendrix albums am I missing?”
    </div>
  </main>

  <!-- Typing indicator -->
  <div id="typing" class="hidden px-4 py-2">
    <div class="flex gap-1">
      <div class="w-2 h-2 bg-stone-500 rounded-full typing-dot"></div>
      <div class="w-2 h-2 bg-stone-500 rounded-full typing-dot"></div>
      <div class="w-2 h-2 bg-stone-500 rounded-full typing-dot"></div>
    </div>
  </div>

  <!-- Input -->
  <footer class="bg-stone-800 border-t border-stone-700 p-3 shrink-0">
    <form id="chat-form" class="flex gap-2">
      <input
        id="message-input"
        type="text"
        autocomplete="off"
        placeholder="Ask Lemieux..."
        class="flex-1 bg-stone-900 border border-stone-700 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-amber-600"
      >
      <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-stone-900 font-semibold px-4 py-2 rounded-md text-sm transition">
        Send
      </button>
    </form>
  </footer>

  <!-- Password modal -->
  <div id="password-modal" class="fixed inset-0 bg-stone-950/90 flex items-center justify-center z-50">
    <div class="bg-stone-800 p-6 rounded-lg w-80 border border-stone-700">
      <h2 class="text-lg font-semibold mb-2">Enter Lemieux password</h2>
      <p class="text-xs text-stone-400 mb-4">The password is in your <code>.env</code> as <code>LEMIEUX_WEB_PASSWORD</code>.</p>
      <input id="password-input" type="password" class="w-full bg-stone-900 border border-stone-700 rounded px-3 py-2 mb-4 text-sm" placeholder="Password">
      <button id="password-submit" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-900 font-semibold py-2 rounded text-sm">Open</button>
      <p id="password-error" class="text-red-400 text-xs mt-2 hidden">Incorrect password.</p>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const typingEl = document.getElementById('typing');
    const emptyState = document.getElementById('empty-state');
    const passwordModal = document.getElementById('password-modal');
    const passwordInput = document.getElementById('password-input');
    const passwordSubmit = document.getElementById('password-submit');
    const passwordError = document.getElementById('password-error');

    let password = localStorage.getItem('lemieux-password') || '';
    if (password) passwordModal.classList.add('hidden');

    passwordSubmit.addEventListener('click', () => {
      password = passwordInput.value;
      localStorage.setItem('lemieux-password', password);
      passwordModal.classList.add('hidden');
    });

    function escapeHtml(text) {
      return text.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }

    function appendMessage(role, text, tools) {
      if (emptyState) emptyState.style.display = 'none';
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bubble = document.createElement('div');
      bubble.className = role === 'user'
        ? 'bg-amber-600 text-stone-900 rounded-lg rounded-tr-none px-4 py-2 max-w-[85%]'
        : 'bg-stone-800 border border-stone-700 rounded-lg rounded-tl-none px-4 py-2 max-w-[90%]';

      const content = document.createElement('div');
      content.className = 'message text-sm leading-relaxed';
      content.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
      bubble.appendChild(content);

      if (tools && tools.length) {
        const details = document.createElement('details');
        details.className = 'mt-2 text-stone-400';
        details.innerHTML = `<summary class="tool-call cursor-pointer hover:text-stone-300">${tools.length} tool call${tools.length > 1 ? 's' : ''}</summary>`;
        const list = document.createElement('div');
        list.className = 'mt-1 space-y-1 pl-2 border-l-2 border-stone-700';
        tools.forEach(tool => {
          const item = document.createElement('div');
          item.className = 'tool-call text-stone-500';
          item.innerHTML = `→ <strong class="text-stone-300">${escapeHtml(tool.name)}</strong>(${escapeHtml(JSON.stringify(tool.arguments))})`;
          list.appendChild(item);
        });
        details.appendChild(list);
        bubble.appendChild(details);
      }

      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function apiCall(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${password}`
        },
        body: JSON.stringify(body)
      });
      if (res.status === 401) {
        localStorage.removeItem('lemieux-password');
        passwordModal.classList.remove('hidden');
        passwordError.classList.remove('hidden');
        throw new Error('Unauthorized');
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text, []);
      input.value = '';
      typingEl.classList.remove('hidden');

      try {
        const data = await apiCall('/chat', { message: text });
        typingEl.classList.add('hidden');
        appendMessage('assistant', data.reply, data.tools);
      } catch (err) {
        typingEl.classList.add('hidden');
        appendMessage('assistant', `Error: ${err.message}`, []);
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      messagesEl.innerHTML = '';
      apiCall('/session', {});
    });

    document.getElementById('sweep-btn').addEventListener('click', async () => {
      appendMessage('user', '[Run release sweep]', []);
      typingEl.classList.remove('hidden');
      try {
        const data = await apiCall('/sweep', {});
        typingEl.classList.add('hidden');
        appendMessage('assistant', data.report || 'Sweep complete. No report text returned.', data.tools);
      } catch (err) {
        typingEl.classList.add('hidden');
        appendMessage('assistant', `Sweep error: ${err.message}`, []);
      }
    });

    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') passwordSubmit.click(); });
  </script>
</body>
</html>
